    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0c0c0c;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Ефект старої ЕПТ-трубки (сканлайни) */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 999;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        .game-container {
            width: 100%;
            max-width: 750px;
            background: #141414;
            border: 2px solid #ff3333;
            box-shadow: 0 0 20px rgba(255, 51, 51, 0.4);
            padding: 25px;
            margin: 20px;
            border-radius: 6px;
            position: relative;
            z-index: 2;
        }

        .header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed #ff3333;
            padding-bottom: 12px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #ff3333;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .visual-box {
            width: 100%;
            height: 180px;
            background: #1c1c1c;
            border: 1px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
            text-align: center;
            padding: 15px;
        }

        .visual-box::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 51, 51, 0.1), transparent);
            animation: scanline 3s infinite;
        }

        @keyframes scanline {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .visual-text {
            color: #ffcccc;
            font-size: 15px;
            line-height: 1.5;
        }

        .story-text {
            font-size: 17px;
            line-height: 1.6;
            margin-bottom: 25px;
            color: #e0e0e0;
            min-height: 80px;
        }

        .timer-display {
            color: #ff3333;
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 15px;
            text-align: center;
            letter-spacing: 2px;
        }

        .choices-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .choice-btn {
            background: #1a1a1a;
            color: #00ff66;
            border: 1px solid #00ff66;
            padding: 14px 18px;
            text-align: left;
            font-family: 'Courier New', Courier, monospace;
            font-size: 15px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .choice-btn:hover {
            background: #00ff66;
            color: #0c0c0c;
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.5);
            transform: translateY(-2px);
        }

        .audio-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: 1px solid #ff3333;
            color: #ff3333;
            padding: 5px 10px;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            border-radius: 3px;
        }

        .audio-toggle:hover {
            background: #ff3333;
            color: #141414;

    <script>
        // Web Audio API синтезатор звуків
        let audioCtx = null;
        let soundEnabled = false;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function toggleAudio() {
            initAudio();
            soundEnabled = !soundEnabled;
            document.getElementById('audioToggle').innerText = soundEnabled ? 'ЗВУК: УВІМК' : 'ЗВУК: ВИМК';
            if (soundEnabled && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            playSound('click');
        }

        function playSound(type) {
            if (!soundEnabled || !audioCtx) return;

            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;

                if (type === 'click') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.05);
                    gain.gain.setValueAtTime(0.05, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
                    osc.start(now);
                    osc.stop(now + 0.05);
                } else if (type === 'alarm') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.linearRampToValueAtTime(600, now + 0.2);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
                    osc.start(now);
                    osc.stop(now + 0.25);
                } else if (type === 'victory') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, now); // C5
                    osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
                    osc.frequency.setValueAtTime(783.99, now + 0.2); // G5
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
                    osc.start(now);
                    osc.stop(now + 0.4);
                }
            } catch (e) {
                console.log("Audio context error:", e);
            }
        }

        let currentSeriesId = 1;
        let timerInterval = null;

        function renderSeries(id) {
            currentSeriesId = id;
            const series = gameData[id];
            if (!series) return;

            // Зупиняємо попередні таймери
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }

            // Оновлюємо заголовок та прогрес
            document.getElementById('seriesTitle').innerText = series.title;
            document.getElementById('progressIndicator').innerText = `${id} / 60`;
            document.getElementById('visualText').innerText = series.visual;
            document.getElementById('storyText').innerText = series.text;

            // Робота з таймером (якщо передбачено в серії)
            const timerEl = document.getElementById('timerDisplay');
            if (series.timer) {
                timerEl.style.display = 'block';
                let timeLeft = 15;
                timerEl.innerText = `ТАЙМЕР УВАГИ: 00:${timeLeft < 10 ? '0' : ''}${timeLeft}`;
                playSound('alarm');

                timerInterval = setInterval(() => {
                    timeLeft--;
                    timerEl.innerText = `ТАЙМЕР УВАГИ: 00:${timeLeft < 10 ? '0' : ''}${timeLeft}`;
                    if (timeLeft <= 0) {
                        clearInterval(timerInterval);
                        timerEl.innerText = "ЧАС ВИЙШОВ! СИСТЕМА ПЕРЕЗАВАНТАЖЕНА!";
                    }
                }, 1000);
            } else {
                timerEl.style.display = 'none';
            }

            // Рендер кнопок вибору
            const container = document.getElementById('choicesContainer');
            container.innerHTML = '';

            series.choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.innerText = choice.text;
                btn.onclick = () => {
                    playSound('click');
                    if (series.isFinal) {
                        playSound('victory');
                    }
                    renderSeries(choice.next);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                };
                container.appendChild(btn);
            });
        }

        // Запуск гри при завантаженні сторінки
        window.onload = () => {
            renderSeries(1);
        };
    </script>
</body>
</html>
