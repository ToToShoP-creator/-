<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.R.C.P.: Операція Виживання 3D</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #050505;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }
        #gameCanvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(10, 10, 10, 0.85);
            border: 2px solid #ff3333;
            padding: 20px;
            max-width: 450px;
            border-radius: 6px;
            box-shadow: 0 0 15px rgba(255, 51, 51, 0.4);
            pointer-events: auto;
        }
        h1 { font-size: 18px; color: #ff3333; margin-bottom: 10px; text-transform: uppercase; }
        p { font-size: 14px; line-height: 1.5; margin-bottom: 15px; color: #e0e0e0; }
        .controls-hint {
            font-size: 12px;
            color: #00ff66;
            border-top: 1px dashed #444;
            padding-top: 10px;
            margin-bottom: 15px;
        }
        .action-btn {
            background: #1a1a1a;
            color: #00ff66;
            border: 1px solid #00ff66;
            padding: 10px 15px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
            width: 100%;
            margin-top: 5px;
            transition: all 0.2s;
        }
        .action-btn:hover {
            background: #00ff66;
            color: #050505;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div class="ui-overlay">
        <h1 id="missionTitle">СЕРІЯ 1: ПРОБУДЖЕННЯ</h1>
        <p id="missionText">Ти в темному приміщенні бункера. Навколо червоне аварійне світло. Використовуй клавіші W, A, S, D (або стрілки), щоб рухатися і дістатися до виходу!</p>
        <div class="controls-hint">
            КЕРУВАННЯ: [W, A, S, D] або [Стрілки] — рух персонажа. [ПРОБІГ] — дія / стрибок.
        </div>
        <div id="choiceContainer">
            <button class="action-btn" onclick="nextMission()">[ ПРОДОВЖИТИ ШЛЯХ ]</button>
        </div>
    </div>

    <!-- Підключаємо Three.js для 3D-графіки -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Сценарійні місії для 3D світу
        const missions = [
            { title: "СЕРІЯ 1: ПРОБУДЖЕННЯ", text: "Ти лежиш на підлозі бази S.R.C.P. На столі блимає таймер. Потрібно терміново тікати через вентиляцію чи двері!" },
            { title: "СЕРІЯ 2-3: ПОВЕРХНЯ", text: "Ти вибрався на руїни закинутого заводу. В небі нишпорять дрони-сканери. Тримайся укриттів!" },
            { title: "СЕРІЯ 12: БУНКЕР СХОВИЩА", text: "Ти дійшов до важких герметичних дверей сховища. Потрібно знайти обхідний шлях чи механізм." },
            { title: "СЕРІЯ 30: ШТУРМ ВЕЖІ", text: "Перед тобою висока Вежа зв'язку у тумані. Час вирішити долю системи." },
            { title: "СЕРІЯ 60: ГРАНД-ФІНАЛ", text: "Серце мережі відключено. Протокол перезапущено. Світ починає відновлюватися!" }
        ];

        let currentMissionIdx = 0;

        function nextMission() {
            currentMissionIdx = (currentMissionIdx + 1) % missions.length;
            document.getElementById('missionTitle').innerText = missions[currentMissionIdx].title;
            document.getElementById('missionText').innerText = missions[currentMissionIdx].text;
            
            // Змінюємо колір освітлення та оточення залежно від акту
            if (currentMissionIdx === 1) {
                scene.background = new THREE.Color(0x0a0a15);
                cube.material.color.setHex(0x0088ff);
            } else if (currentMissionIdx >= 3) {
                scene.background = new THREE.Color(0x150505);
                cube.material.color.setHex(0xff3333);
            } else {
                scene.background = new THREE.Color(0x0c0c0c);
                cube.material.color.setHex(0x00ff66);
            }
        }

        // --- 3D СЦЕНА (Three.js) ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0c0c0c);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 10);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gameCanvas'), antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;

        // Освітлення у стилі кіберпанк
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0xff3333, 2, 50);
        pointLight.position.set(0, 8, 0);
        scene.add(pointLight);

        // Підлога бункера/бази
        const floorGeo = new THREE.PlaneGeometry(40, 40);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x141414, roughness: 0.8 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // Світлові смуги на підлозі (декор)
        for(let i = -15; i <= 15; i += 5) {
            const lineGeo = new THREE.BoxGeometry(0.2, 0.05, 38);
            const lineMat = new THREE.MeshBasicMaterial({ color: 0xff3333 });
            const line = new THREE.Mesh(lineGeo, lineMat);
            line.position.set(i, 0.01, 0);
            scene.add(line);
        }

        // Персонаж гравця (аватари S.R.C.P.)
        const cubeGeo = new THREE.BoxGeometry(1.2, 2, 0.8);
        const cubeMat = new THREE.MeshStandardMaterial({ color: 0x00ff66, roughness: 0.3 });
        const cube = new THREE.Mesh(cubeGeo, cubeMat);
        cube.position.y = 1;
        scene.add(cube);

        // Перешкоди / колони на базі
        const obstacles = [];
        for (let i = 0; i < 6; i++) {
            const obsGeo = new THREE.BoxGeometry(1.5, 4, 1.5);
            const obsMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
            const obs = new THREE.Mesh(obsGeo, obsMat);
            obs.position.set((Math.random() - 0.5) * 20, 2, (Math.random() - 0.5) * 20);
            scene.add(obs);
            obstacles.push(obs);
        }

        // Управління клавішами
        const keys = { w: false, a: false, s: false, d: false, ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };

        window.addEventListener('keydown', (e) => {
            if (keys.hasOwnProperty(e.key) || keys.hasOwnProperty(e.code)) {
                if(e.key === 'w' || e.code === 'KeyW' || e.key === 'ArrowUp') keys.w = true;
                if(e.key === 's' || e.code === 'KeyS' || e.key === 'ArrowDown') keys.s = true;
                if(e.key === 'a' || e.code === 'KeyA' || e.key === 'ArrowLeft') keys.a = true;
                if(e.key === 'd' || e.code === 'KeyD' || e.key === 'ArrowRight') keys.d = true;
            }
        });

        window.addEventListener('keyup', (e) => {
            if(e.key === 'w' || e.code === 'KeyW' || e.key === 'ArrowUp') keys.w = false;
            if(e.key === 's' || e.code === 'KeyS' || e.key === 'ArrowDown') keys.s = false;
            if(e.key === 'a' || e.code === 'KeyA' || e.key === 'ArrowLeft') keys.a = false;
            if(e.key === 'd' || e.code === 'KeyD' || e.key === 'ArrowRight') keys.d = false;
        });

        // Анімація та рух
        const speed = 0.12;

        function animate() {
            requestAnimationFrame(animate);

            // Рух персонажа стрілками / WASD
            if (keys.w || keys.ArrowUp) cube.position.z -= speed;
            if (keys.s || keys.ArrowDown) cube.position.z += speed;
            if (keys.a || keys.ArrowLeft) cube.position.x -= speed;
            if (keys.d || keys.ArrowRight) cube.position.x += speed;

            // Обмеження поля
            cube.position.x = Math.max(-18, Math.min(18, cube.position.x));
            cube.position.z = Math.max(-18, Math.min(18, cube.position.z));

            // Плавне слідування камери за персонажем
            camera.position.x += (cube.position.x - camera.position.x) * 0.05;
            camera.position.z += (cube.position.z + 8 - camera.position.z) * 0.05;
            camera.lookAt(cube.position.x, cube.position.y, cube.position.z);

            renderer.render(scene, camera);
        }

        animate();

        // Адаптивність при зміні розміру вікна
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
